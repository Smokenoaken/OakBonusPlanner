name: Publish GitHub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Package addon
        id: package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          ./package-release.ps1 -Version $version
          "zip=dist/OakBonusPlanner-v$version.zip" >> $env:GITHUB_OUTPUT

      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "${{ steps.package.outputs.zip }}" \
            --repo "${{ github.repository }}" \
            --title "Oak Bonus Planner ${{ github.ref_name }}" \
            --prerelease \
            --generate-notes
